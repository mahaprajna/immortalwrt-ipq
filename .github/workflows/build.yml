name: Build Gaojianli ImmortalWrt‑NSS AX3600‑stock

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          submodules: true

      - name: Pull git submodules
        run: git submodule update --init --recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-pip python3-setuptools python3-dev rsync unzip wget

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate config for xiaomi,ax3600-stock
        run: |
          make defconfig TARGET=qualcommax SUBTARGET=ipq807x BOARD=xiaomi_ax3600-stock

          # ========== 系统 & 中文LuCI基础 ==========
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-admin‑system‑zh‑cn=y" >> .config

          # ========== NSS硬件加速 ECM ==========
          echo "CONFIG_PACKAGE_kmod-nss-ifb=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-nss-drv=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-nss-ecm=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-nss-ecm‑diagnostics=y" >> .config

          # ========== WIFI 避免hostapd冲突，wpad‑openssl ==========
          echo "CONFIG_PACKAGE_wpad-openssl=y" >> .config
          echo "# CONFIG_PACKAGE_wpad-basic is not set" >> .config
          echo "# CONFIG_PACKAGE_hostapd is not set" >> .config
          echo "# CONFIG_PACKAGE_hostapd-common is not set" >> .config

          # ========== Bridger WED桥卸载 ==========
          echo "CONFIG_PACKAGE_bridger=y" >> .config

          # ========== iStoreOS 应用商店 ==========
          echo "CONFIG_PACKAGE_luci-app‑istore=y" >> .config

          # ========== 常用网络组件 ==========
          echo "CONFIG_PACKAGE_tcpdump=y" >> .config
          echo "CONFIG_PACKAGE_curl=y" >> .config
          echo "CONFIG_PACKAGE_wget‑ssl=y" >> .config
          echo "CONFIG_PACKAGE_nload=y" >> .config
          echo "CONFIG_PACKAGE_iperf3=y" >> .config

          # ========== 插件可按需自行增删 ==========
          # echo "CONFIG_PACKAGE_luci-app‑dae=y" >> .config
          # echo "CONFIG_PACKAGE_dae=y" >> .config

          make oldconfig

      - name: Compile firmware
        run: |
          make -j$(nproc)

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AX3600‑stock‑firmware
          path: |
            bin/targets/qualcommax/ipq807x/*.bin
            bin/targets/qualcommax/ipq807x/*.ubi
