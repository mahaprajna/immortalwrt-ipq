name: Build Gaojianli ImmortalWrt-NSS for AX3600

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          submodules: true

      - name: Pull git submodules
        run: git submodule update --init --recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-pip python3-setuptools python3-dev rsync unzip wget

      - name: List available AX3600 devices
        run: |
          echo "=== all AX3600 related devices ==="
          grep -rE "define Device/.*ax3600" target/linux/ || true

      - name: Update feeds
        run: |
          sed -i '/src-git istore/d' feeds.conf.default
          echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config
        run: |
          echo "CONFIG_TARGET_qualcommax=y" > .config
          echo "CONFIG_TARGET_qualcommax_ipq807x=y" >> .config
          echo "CONFIG_TARGET_MULTI_PROFILE=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq807x_DEVICE_xiaomi_ax3600=y" >> .config

          # NSS基础驱动
          echo "CONFIG_PACKAGE_kmod-qca-nss-drv=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-nss-ecm=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-nss-dp=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-nss-clients=y" >> .config
          echo "CONFIG_PACKAGE_nss-firmware-ipq807x=y" >> .config

          # LuCI & iStore
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-base=y" >> .config
          echo "CONFIG_PACKAGE_luci-admin-full=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
          echo "CONFIG_PACKAGE_luci-compat=y" >> .config
          echo "CONFIG_PACKAGE_luci-lib-taskd=y" >> .config
          echo "CONFIG_PACKAGE_luci-lib-xterm=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-store=y" >> .config
          echo "CONFIG_PACKAGE_istore=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-nss=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-turboacc=y" >> .config
          echo "CONFIG_PACKAGE_kmod-turboacc=y" >> .config

          # 基础系统包
          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          echo "CONFIG_PACKAGE_dropbear=y" >> .config
          echo "CONFIG_PACKAGE_firewall4=y" >> .config
          echo "CONFIG_PACKAGE_htop=y" >> .config

          # 【核心修复1】启用 Wi-Fi 6 基础支持，解决 he_mu_edca 报错
          echo "CONFIG_DRIVER_11AX_SUPPORT=y" >> .config

          # hostapd/wpa 独立包，关闭 HE_UCA
          echo "CONFIG_PACKAGE_hostapd-openssl=y" >> .config
          echo "CONFIG_PACKAGE_wpa-supplicant-openssl=y" >> .config
          echo "CONFIG_PACKAGE_hostapd-common=y" >> .config
          echo "# CONFIG_HOSTAPD_HE_UCA is not set" >> .config
          echo "# CONFIG_WPA_SUPPLICANT_HE_UCA is not set" >> .config

          # 【核心修复2】显式禁用所有 wpad 变体，防止自动选中 wpad-full-openssl
          echo "# CONFIG_PACKAGE_wpad-openssl is not set" >> .config
          echo "# CONFIG_PACKAGE_wpad-full-openssl is not set" >> .config
          echo "# CONFIG_PACKAGE_wpad-basic-mbedtls is not set" >> .config
          echo "# CONFIG_PACKAGE_hostapd-full is not set" >> .config

          # ath11k + BDF 包
          echo "CONFIG_PACKAGE_kmod-ath11k=y" >> .config
          echo "CONFIG_PACKAGE_kmod-ath11k-ahb=y" >> .config
          echo "CONFIG_PACKAGE_ath11k-firmware-ipq8074=y" >> .config
          echo "CONFIG_PACKAGE_ipq-wifi-xiaomi-ax3600=y" >> .config

          # 禁用旧 ath10k
          echo "# CONFIG_PACKAGE_kmod-ath10k is not set" >> .config
          echo "# CONFIG_PACKAGE_ath10k-firmware-qca9887 is not set" >> .config
          echo "# CONFIG_PACKAGE_ath10k-firmware-qca99x0 is not set" >> .config

          make defconfig

      - name: Force override critical configs (robust)
        run: |
          # 1. 确保 HE_UCA 被禁用 (兼容各种可能出现的格式)
          sed -i 's/^CONFIG_HE_UCA=y/# CONFIG_HE_UCA is not set/' .config
          sed -i 's/^CONFIG_HOSTAPD_HE_UCA=y/# CONFIG_HOSTAPD_HE_UCA is not set/' .config
          sed -i 's/^CONFIG_WPA_SUPPLICANT_HE_UCA=y/# CONFIG_WPA_SUPPLICANT_HE_UCA is not set/' .config
          
          # 2. 确保禁用 wpad-full-openssl：先删除任何已存在行，再追加注释行，避免重复
          sed -i '/^CONFIG_PACKAGE_wpad-full-openssl/d' .config
          sed -i '/^# CONFIG_PACKAGE_wpad-full-openssl is not set/d' .config
          echo "# CONFIG_PACKAGE_wpad-full-openssl is not set" >> .config
          
          # 3. 确保 Wi-Fi 6 基础支持被开启：清掉旧行，强制追加=y
          sed -i '/^# CONFIG_DRIVER_11AX_SUPPORT is not set/d' .config
          sed -i '/^CONFIG_DRIVER_11AX_SUPPORT=/d' .config
          echo "CONFIG_DRIVER_11AX_SUPPORT=y" >> .config
          
          # 4. 二次强制覆写关键包，防止被 defconfig 降级为 m
          for opt in \
            CONFIG_PACKAGE_kmod-qca-nss-drv \
            CONFIG_PACKAGE_kmod-qca-nss-ecm \
            CONFIG_PACKAGE_kmod-qca-nss-dp \
            CONFIG_PACKAGE_kmod-qca-nss-clients \
            CONFIG_PACKAGE_nss-firmware-ipq807x \
            CONFIG_PACKAGE_kmod-turboacc \
            CONFIG_PACKAGE_luci-app-nss \
            CONFIG_PACKAGE_luci-app-turboacc \
            CONFIG_PACKAGE_hostapd-common \
            CONFIG_PACKAGE_hostapd-openssl \
            CONFIG_PACKAGE_wpa-supplicant-openssl \
            CONFIG_PACKAGE_kmod-ath11k \
            CONFIG_PACKAGE_kmod-ath11k-ahb \
            CONFIG_PACKAGE_ath11k-firmware-ipq8074 \
            CONFIG_PACKAGE_ipq-wifi-xiaomi-ax3600 \
            CONFIG_PACKAGE_luci-i18n-base-zh-cn \
            CONFIG_PACKAGE_luci-i18n-firewall-zh-cn ; do
            sed -i "/^# $opt is not set/d" .config
            if grep -q "^$opt=" .config; then
              sed -i "s/^$opt=.*/$opt=y/" .config
            else
              echo "$opt=y" >> .config
            fi
          done

      - name: Verify config
        run: |
          echo "=== 设备 ==="
          grep -E "CONFIG_TARGET_qualcommax_ipq807x_DEVICE" .config || true
          echo "=== Wi-Fi 6 基础支持（必须为y） ==="
          grep "CONFIG_DRIVER_11AX_SUPPORT" .config || true
          echo "=== HE UCA (不能出现=y) ==="
          grep -E "CONFIG_(HE_UCA|HOSTAPD_HE_UCA|WPA_SUPPLICANT_HE_UCA)=y" .config || true
          echo "=== wpad 变体（全部为 not set） ==="
          grep -E "CONFIG_PACKAGE_wpad" .config || true
          echo "=== hostapd 组件 ==="
          grep -E "CONFIG_PACKAGE_hostapd" .config || true
          echo "=== NSS packages ==="
          grep -E "CONFIG_PACKAGE_(kmod-qca-nss|nss-firmware)" .config || true
          echo "=== ath11k 驱动 ==="
          grep -E "CONFIG_PACKAGE_kmod-ath11k" .config || true
          echo "=== NSS LuCI & turboacc ==="
          grep -E "CONFIG_PACKAGE_(luci-app-(nss|turboacc)|kmod-turboacc)" .config || true

      - name: Compile firmware
        run: make -j1 V=s

      - name: Generate MD5 checksum
        run: |
          cd bin/targets/qualcommax/ipq807x
          md5sum *.bin > md5sums.txt
          echo "==== MD5 Checksum ===="
          cat md5sums.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-AX3600-Bigpart-NSS-ECM
          path: bin/targets/qualcommax/ipq807x/
          if-no-files-found: error
