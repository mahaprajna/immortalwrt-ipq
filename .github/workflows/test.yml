name: Diagnose hostapd source

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-pip python3-setuptools python3-dev rsync unzip wget

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate minimal config
        run: |
          echo "CONFIG_TARGET_qualcommax=y" > .config
          echo "CONFIG_TARGET_qualcommax_ipq807x=y" >> .config
          echo "CONFIG_TARGET_MULTI_PROFILE=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq807x_DEVICE_xiaomi_ax3600=y" >> .config
          echo "CONFIG_DRIVER_11AX_SUPPORT=y" >> .config
          echo "CONFIG_PACKAGE_kmod-ath11k=y" >> .config
          make defconfig

      - name: Prepare wpad source only
        run: |
          echo "=== 只解压 wpad 源码，不编译 ==="
          make package/network/services/wpad/prepare V=s 2>&1 | tail -20

      - name: Find hostapd.c and he_mu_edca
        run: |
          echo "=== 找到的 hostapd.c ==="
          find build_dir -name "hostapd.c"
          echo ""
          echo "=== he_mu_edca 出现位置 ==="
          find build_dir -name "hostapd.c" -exec grep -n "he_mu_edca" {} +
